name: CI

# Type-check and test every push and pull request, and prove the image still builds. When
# everything passes on main, push the customers' panel to Docker Hub.
# A pull request never pushes anything.
#
# Needs, in Settings > Secrets and variables > Actions:
#   variable  DOCKERHUB_USERNAME
#   secret    DOCKERHUB_TOKEN        (a Docker Hub personal access token with Read & Write)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request replaces the run in progress; main always finishes,
# so every commit that lands is tested and published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile's own Node, so a pass here means the same in the image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - uses: docker/setup-buildx-action@v3

      # `next build` runs inside the Dockerfile, so this catches a build that fails before it
      # is merged. Nothing is pushed; the layers are kept for the push job.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only after every check above passed, and only for a commit that landed on main.
  push:
    name: Push the_way_frontend
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest is what Railway runs; sha-<short> pins this exact build, to roll back to.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/the_way_frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the layers the test job just built come from the cache, so this mostly pushes
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
